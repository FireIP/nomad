name: Script tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh scripts/nomad; do
            bash -n "$script" || exit
          done
      - name: Test simulated two-host behavior
        run: python3 -B -m unittest discover -s tests -v
